name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src

env:
  CI: true

jobs:
  checks:
    name: Check (${{ matrix.check }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [format, lint, typecheck, pbt]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check formatting
        if: matrix.check == 'format'
        run: pnpm exec prettier --check . ../.github
      - name: Lint
        if: matrix.check == 'lint'
        run: pnpm lint
      - name: Type check
        if: matrix.check == 'typecheck'
        run: pnpm typecheck
      - name: Property-based tests
        if: matrix.check == 'pbt'
        run: pnpm test:pbt

  unit:
    name: Unit and coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Unit tests with coverage
        run: pnpm test:coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-${{ matrix.os }}
          path: src/coverage/
          retention-days: 7

  mutation:
    name: Mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Mutation tests
        run: pnpm test:mutation --concurrency 2
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mutation
          path: src/reports/mutation/
          retention-days: 7

  e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Download Electron before the first test
        run: pnpm exec electron --version
      - name: Build and run Electron E2E tests
        run: pnpm test:e2e
      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: e2e-${{ matrix.os }}
          path: src/test-results/
          include-hidden-files: true
          retention-days: 7
